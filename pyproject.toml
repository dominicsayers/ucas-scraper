[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ucas-scraper"
version = "0.1.0"
description = "Fetch course data from the UCAS (the UK Universities and Colleges Admissions Service) website"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bs4>=0.0.2",
    "httpx[http2]>=0.27.2",
]

[dependency-groups]
dev = [
    "conventional-commits-check>=2.3.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.7.2",
    "types-beautifulsoup4>=4.12.0.20241020",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--cov=v3 --cov-report=term-missing --cov-fail-under=100"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/v3"]

[tool.coverage.report]
exclude_also = [
    "if __name__ == .__main__.:",
]
